# Book settings
title: Mo Houshmand
author: Daniel Mo Houshmand
copyright: "2026"
logo: img/mologo/mo0.png

only_build_toc_files: true
# The local build environment and the notes are never pages.
exclude_patterns: [.venv, _build, _notes, "**/.ipynb_checkpoints", Thumbs.db, .DS_Store]

# Execution settings
execute:
  # The notebooks are published with their stored outputs. Several use Qiskit APIs that current
  # Qiskit has removed (BasicAer, execute, qiskit.aqua), so re-running them would fail the build.
  execute_notebooks: "off"
  exclude_patterns:
    - '_build'
    - 'Thumbs.db'
    - '.DS_Store'
    - '*pattern3withwildcard'
    - 'dsData.zip'
    - '_notes'

# Parse and render settings
parse:
  myst_enable_extensions:
#    - amsmath
    - colon_fence
#    - deflist
    - dollarmath
    - html_admonition
    - html_image
#    - linkify
#    - replacements
    - smartquotes
#    - substitution
    - tasklist

  myst_url_schemes: [mailto, http, https]
  myst_dmath_double_inline: true

# HTML-specific settings
html:
  favicon: img/mologo/mo-favicon.png
  use_issues_button: true
  use_repository_button: true
  use_edit_page_button: true
  use_multitoc_numbering: true
  home_page_in_navbar: true
  extra_footer: ""
  baseurl: "https://mohoushmand.com"

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Launch button settings
launch_buttons:
  notebook_interface: classic
  binderhub_url: https://mybinder.org
  thebe: true

# Information about where the book exists on the web
repository:
  url: https://github.com/MoHoushmand/mo
  path_to_book: ""
  branch: main

sphinx:
  # dedupe_scripts: sphinx-thebe would otherwise declare its config twice on every page (see _ext/).
  local_extensions:
    dedupe_scripts: _ext
  extra_extensions:
    - sphinx_inline_tabs
    - sphinx_copybutton
    - sphinx_design
    - sphinx_exercise

  config:
    html_title: Mo Houshmand
    html_static_path: [_static]
    # Mo Paper: the site's own theme, on top of sphinx-book-theme. custom.css keeps the classes the
    # pages use (the orange admonitions, the picture cards), restyled to match.
    html_css_files: [mo-paper.css, custom.css]
    # CNAME is copied to the site root, so every deploy keeps the mohoushmand.com domain.
    html_extra_path: [CNAME]
    # The site opens in paper light; readers can switch to Umber Night.
    html_context:
      default_mode: light
    html_theme_options:
      home_page_in_toc: true
      show_toc_level: 2
      logo:
        text: Mo Houshmand
        alt_text: Mo Houshmand, home
      pygments_light_style: default
      pygments_dark_style: monokai
